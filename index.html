    const lift = smooth(t / liftDuration) * smooth((waveDuration - t) / liftDuration);
    const phase = 2 * Math.PI * (t - liftDuration) / .83;
    const angle = lift * (24 + 2.5 * Math.sin(phase));
    const bend = lift * (15 + 6 * Math.sin(phase - .4));
    if (angle !== lastAngle) {
      shoulder.setRotate(angle, 233, 493);
      wave.setRotate(angle, 233, 493);
      lastAngle = angle;
    }
    if (bend !== lastBend) {
      wrist.setRotate(bend, 177, 528);
      lastBend = bend;
    }
    const distance = Math.min(Math.abs(t - 1.17), Math.abs(t - 2.47), Math.abs(t - 4.22));
    const openness = .1 + .9 * smooth(distance / .12);
    const nextBlink = openness > .92 ? -1 : openness > .68 ? 0 : openness > .43 ? 1 : openness > .2 ? 2 : 3;
    if (nextBlink !== blink) {
      if (blink >= 0) eyes[blink].setAttribute('visibility', 'hidden');
      if (nextBlink >= 0) eyes[nextBlink].setAttribute('visibility', 'visible');
      blink = nextBlink;
    }
  }

  function finish() {
    cancelAnimationFrame(frame);
    beep.classList.remove('beep-active');
    pose(0);
    busy = false;
    timer = setTimeout(show, 4000 + Math.random() * 3000);
  }

  async function show() {
    if (busy || reducedMotion.matches) return;
    busy = true;
    clearTimeout(timer);
    if (!(await ready) || reducedMotion.matches) {
      busy = false;
      return;
    }
    beep.classList.add('beep-active');
    const animation = beep.getAnimations()[0];
    if (!animation) {
      finish();
      return;
    }
    function tick() {
      pose(Math.max(0, animation.currentTime ?? 0) / 1000);
      frame = requestAnimationFrame(tick);
    }
    frame = requestAnimationFrame(tick);
    animation.finished.then(finish, finish);
  }

  timer = setTimeout(show, 2000);
  reducedMotion.addEventListener('change', () => {
    if (!reducedMotion.matches && !busy) {
      clearTimeout(timer);
      timer = setTimeout(show, 2000);
    }
  });
  document.addEventListener('keydown', event => {
    if (['b', 'и'].includes(event.key.toLowerCase())) show();
  });
})();
</script></body></html>
